[toolchain]
package_manager = "yarn"
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ace_insurance = "4LP2JnLzuPhTCLR6MzPEr2Cr2zU3om7Sk33G5QaeKXRU"

[programs.devnet]
ace_insurance = "4LP2JnLzuPhTCLR6MzPEr2Cr2zU3om7Sk33G5QaeKXRU"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
[test]
startup_wait = 30000
